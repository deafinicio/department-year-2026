name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in site/*.js; do
            node --check "$file"
          done
      - name: Check local assets
        run: python3 scripts/check-site.py
      - name: Check presentation content
        run: node scripts/check-content.mjs
      - name: Check cinematic framing and scene interactions
        run: node --experimental-vm-modules scripts/check-cinema.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node for the cluster presentation
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cluster/package-lock.json
      - name: Build the cluster presentation
        working-directory: cluster
        run: |
          npm ci
          npm test
          npm run build
          mkdir -p ../site/cluster
          cp -a dist/. ../site/cluster/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for the Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..8}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count') && [ "$count" -gt 0 ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::The uploaded Pages artifact is not yet available."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
